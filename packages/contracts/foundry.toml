[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../../node_modules"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
  "@ethereum-attestation-service/eas-contracts/=../../node_modules/@ethereum-attestation-service/eas-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
